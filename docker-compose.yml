services:
  db:
    image: postgres:16-alpine
    container_name: narra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: narra
    ports:
      - "5432:5432"
    volumes:
      - narra-pgdata:/var/lib/postgresql/data

volumes:
  narra-pgdata:

name: Narra patch 0.11.18

on:
  push:
    paths:
      - '.github/workflows/narra-patch-01118.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Narra Patch Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Patch 0.11.18 - dialogue direction note
        shell: python
        run: |
          from pathlib import Path
          import json

          scene_item = Path('src/components/scene-block-item.tsx')
          text = scene_item.read_text()
          needle = '''          {block.type === "dialogue" && (\n            <div className="mb-3 border-y border-narra-border bg-narra-bg/50 px-3 py-3">\n              <div className="flex flex-wrap items-center justify-between gap-3">'''
          replacement = '''          {block.type === "dialogue" && (\n            <div className="mb-3 border-y border-narra-border bg-narra-bg/50 px-3 py-3">\n              <label className="mb-3 block">\n                <span className="label block">Indication de dialogue</span>\n                <input\n                  type="text"\n                  value={block.speakerNote && block.speakerNote !== "Inconnu" ? block.speakerNote : ""}\n                  onChange={(event) => onUpdate(block.id, { speakerNote: event.target.value || null })}\n                  placeholder="Ex. à voix basse, dans un souffle, hésitant…"\n                  className="input mt-1 text-sm"\n                />\n              </label>\n              <div className="flex flex-wrap items-center justify-between gap-3">'''
          if needle not in text:
              raise SystemExit('scene-block-item dialogue panel not found')
          scene_item.write_text(text.replace(needle, replacement, 1))

          reader = Path('src/components/readers/project-reader.tsx')
          text = reader.read_text()

          old = '''                <strong>{speaker}</strong>\n                {block.emotion && <span>{block.emotion}</span>}'''
          new = '''                <strong>{speaker}</strong>\n                {block.emotion && <span>{block.emotion}</span>}\n                {block.speakerNote && block.speakerNote !== "Inconnu" && <span>({block.speakerNote})</span>}'''
          if old not in text:
              raise SystemExit('VN speaker render not found')
          text = text.replace(old, new, 1)

          old = '''        {block.emotion && <span className={styles.emotion}>({block.emotion})</span>}\n        <p>{block.content}</p>'''
          new = '''        {block.emotion && <span className={styles.emotion}>({block.emotion})</span>}\n        {block.speakerNote && block.speakerNote !== "Inconnu" && <span className={styles.emotion}>({block.speakerNote})</span>}\n        <p>{block.content}</p>'''
          if old not in text:
              raise SystemExit('document dialogue render not found')
          text = text.replace(old, new, 1)

          old = '''      <label className={styles.portraitToggle}><input type="checkbox" checked={block.showPortrait !== false} onChange={(event) => editor.updateBlock(sceneId, block.id, { showPortrait: event.target.checked })} /> Portrait</label>\n    </div>}'''
          new = '''      <label className={styles.portraitToggle}><input type="checkbox" checked={block.showPortrait !== false} onChange={(event) => editor.updateBlock(sceneId, block.id, { showPortrait: event.target.checked })} /> Portrait</label>\n      <input\n        aria-label="Indication de dialogue"\n        type="text"\n        value={block.speakerNote && block.speakerNote !== "Inconnu" ? block.speakerNote : ""}\n        onChange={(event) => editor.updateBlock(sceneId, block.id, { speakerNote: event.target.value || null })}\n        placeholder="Indication…"\n      />\n    </div>}'''
          if old not in text:
              raise SystemExit('reader EditorFields dialogue controls not found')
          reader.write_text(text.replace(old, new, 1))

          package = Path('package.json')
          data = json.loads(package.read_text())
          data['version'] = '0.11.18'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          workflow = Path('.github/workflows/narra-patch-01118.yml')
          workflow.unlink()

      - name: Commit 0.11.18
        run: |
          git add -A
          git commit -m "feat(dialogue): add freeform direction notes"
          git push
